<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>规训视角 - 最终交互版</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        /* 这种渐变黑边缘可以掩盖 2D 图的边缘感，增加纵深感 */
        #vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.9) 100%);
            pointer-events: none; z-index: 5;
        }
        #instruction {
            position: absolute; bottom: 15%; width: 100%; text-align: center;
            color: white; font-size: 1.2rem; z-index: 10; font-family: sans-serif;
            text-shadow: 0 0 8px rgba(0,0,0,1);
        }
        /* 屏幕中心准心：用于视线引导 */
        #reticle {
            position: absolute; top: 50%; left: 50%; width: 15px; height: 15px;
            border: 2px solid white; border-radius: 50%; transform: translate(-50%, -50%);
            z-index: 100; opacity: 0.6;
        }
    </style>
</head>
<body>
<div id="vignette"></div>
<div id="reticle"></div>
<div id="instruction">盯着画面中心的物品，选择你的生命轨迹</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { VRButton } from 'three/addons/webxr/VRButton.js';

    let scene, camera, renderer, mesh, controls;
    let clock = new THREE.Clock();

    init();

    function init() {
        scene = new THREE.Scene();
        // FOV 调至 90 度，提供更自然的 VR 视野
        camera = new THREE.PerspectiveCamera(90, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 0.1);

        // 核心修正：使用球体几何体，并确保比例不被强行拉伸
        const geometry = new THREE.SphereGeometry(500, 64, 32);
        geometry.scale(-1, 1, 1); 

        const loader = new THREE.TextureLoader();
        // 确保你的文件名正确
        loader.load('1.png', (texture) => {
            texture.colorSpace = THREE.SRGBColorSpace;
            const material = new THREE.MeshBasicMaterial({ map: texture });
            mesh = new THREE.Mesh(geometry, material);
            mesh.rotation.y = -Math.PI / 2; // 将画面核心对准正前方
            scene.add(mesh);
        });

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        document.body.appendChild(VRButton.createButton(renderer));

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableZoom = false;
        controls.rotateSpeed = -1.5; // 提高拖动灵敏度
        controls.enableDamping = true; 

        // 视野限制：防止看到背后的“虚无”区域
        controls.minAzimuthAngle = -Math.PI / 2.5;
        controls.maxAzimuthAngle = Math.PI / 2.5;

        renderer.setAnimationLoop(animate);
    }

    function animate() {
        const delta = clock.getDelta();
        const time = clock.elapsedTime;

        if (!renderer.xr.isPresenting) {
            // --- 影像动起来的秘密：实时模拟生理微动 ---
            // 1. 模拟自然的呼吸起伏 (Y轴)
            camera.position.y = Math.sin(time * 0.5) * 0.05;
            // 2. 模拟由于情绪紧张导致的视觉微颤 (Z轴)
            camera.rotation.z = Math.sin(time * 0.3) * 0.01;
            // 3. 瞳孔脉冲感：轻微改变视野大小，模拟心跳视觉
            camera.fov = 90 + Math.sin(time * 0.4) * 2;
            camera.updateProjectionMatrix();

            controls.update();
        }

        renderer.render(scene, camera);
    }
</script>
</body>
</html>
